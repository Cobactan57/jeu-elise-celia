// Composition originale : « Matin à la ferme », boucle chiptune de 8 mesures.

const farmAudio=(()=>{
 let ac=null,musicGain=null,fxGain=null,master=null,timer=null,next=0,step=0,muted=false;
 const melody=[76,0,79,0,81,79,76,72,74,0,77,0,79,77,74,71,72,0,76,0,79,76,74,72,74,0,76,0,74,71,67,0,76,0,79,0,84,83,81,79,77,0,81,0,79,77,76,74,76,0,79,76,74,72,71,69,71,0,74,0,67,71,72,0];
 const chords=[[48,52,55],[53,57,60],[48,52,55],[55,59,62],[48,52,55],[53,57,60],[57,60,64],[55,59,62]];
 const hz=n=>440*Math.pow(2,(n-69)/12);
 function tone(note,at,duration,volume,type='square',bus=musicGain,endNote=null){
  if(!ac||!bus)return;
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(hz(note),at);

 }
 function sync(){if(!ac)return;const t=ac.currentTime;master.gain.setTargetAtTime(muted?0:.52,t,.025);musicGain.gain.setTargetAtTime(started&&!paused&&!won?1:0,t,.025);fxGain.gain.setTargetAtTime(started&&!paused?1:0,t,.015);}
 function schedule(){if(!ac||ac.state!=='running')return;if(!started||paused||won||muted){next=ac.currentTime+.04;return;}if(next<ac.currentTime)next=ac.currentTime+.04;while(next<ac.currentTime+.12){let i=step%64,chord=chords[Math.floor(i/8)];if(melody[i])tone(melody[i],next,.19,.06,'square');if(i%2===0)tone(chord[i%4===0?0:2]-12,next,.32,.14,'triangle');tone(chord[i%3]+12,next,.13,.025,'triangle');step++;next+=.225;}}

const platforms=[{x:0,y:GROUND,w:WORLD,h:94,type:'ground'},{x:350,y:378,w:130,h:68},{x:650,y:326,w:140,h:120},{x:960,y:370,w:145,h:76},{x:1260,y:310,w:150,h:136},{x:1560,y:368,w:150,h:78},{x:1900,y:330,w:150,h:116},{x:2210,y:380,w:140,h:66}];
let stars;const player={x:60,y:GROUND-68,w:34,h:68,vx:0,vy:0,grounded:true,face:1};
function reset(){Object.assign(player,{x:60,y:GROUND-68,vx:0,vy:0,grounded:true,face:1});stars=[{x:413,y:342},{x:720,y:290},{x:1335,y:274},{x:1975,y:294},{x:2300,y:344}].map(s=>({...s,taken:false}));won=false;paused=false;cam=0;time=0;coyote=0;buffer=0;keys.clear();jumpQueued=false;updateHud();}
function updateHud(){farmAudio.sync();document.querySelector('#score').textContent=stars.filter(s=>s.taken).length+' / 5 étoiles';document.querySelector('#status').textContent=won?'Bravo Élise et Célia !':paused?'Pause': 'Rejoins Célia avec les cinq étoiles';}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function advance(dt){
 time+=dt;if(jumpQueued){buffer=.14;jumpQueued=false;}else buffer=Math.max(0,buffer-dt);
 coyote=player.grounded?.10:Math.max(0,coyote-dt);
 let dir=(keys.has('right')?1:0)-(keys.has('left')?1:0);player.vx=dir*255;if(dir)player.face=dir;
 if(buffer>0&&coyote>0){farmAudio.jump();player.vy=-560;player.grounded=false;buffer=0;coyote=0;}
 player.x+=player.vx*dt;
 for(const p of platforms)if(overlap(player,p))player.x=player.vx>0?p.x-player.w:player.vx<0?p.x+p.w:player.x;
 player.x=Math.max(0,Math.min(WORLD-player.w,player.x));
 player.vy+=1450*dt;player.y+=player.vy*dt;player.grounded=false;
 for(const p of platforms)if(overlap(player,p)){if(player.vy>=0){player.y=p.y-player.h;player.grounded=true;}else player.y=p.y+p.h;player.vy=0;}
 for(const s of stars)if(!s.taken&&overlap(player,{x:s.x-15,y:s.y-15,w:30,h:30})){s.taken=true;farmAudio.collect();updateHud();}
 if(player.x>2630&&stars.every(s=>s.taken)){won=true;keys.clear();updateHud();}
 cam=Math.max(0,Math.min(WORLD-W,player.x-W*.36));
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}

function star(x,y){ctx.fillStyle='#ffdb57';ctx.strokeStyle='#a86e25';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?7:16;let px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fill();ctx.stroke();}

const PAL={ink:'#343343',dark:'#384d41',leaf:['#355847','#44724c','#5b9052','#7faa59','#a8be6a'],soil:['#5d4144','#795347','#986849','#b78558','#d4a369']};

function terrain(){const rand=rng(82);rect(0,GROUND,WORLD,94,PAL.soil[0]);rect(0,GROUND+9,WORLD,18,PAL.soil[1]);rect(0,GROUND+27,WORLD,67,PAL.soil[2]);for(let i=0;i<3000;i++){let x=Math.floor(rand()*WORLD/3)*3,y=GROUND+15+Math.floor(rand()*76/3)*3;rect(x,y,3+Math.floor(rand()*3)*3,3,PAL.soil[Math.floor(rand()*5)]);}for(let x=0;x<WORLD;x+=9){let depth=6+Math.floor(rand()*4)*3;rect(x,GROUND,9,depth,'#466044');rect(x,GROUND,9,6,'#80a154');rect(x,GROUND,6,3,'#c0c67c');if(rand()>.6)rect(x,GROUND-3,3,3,'#88aa58');}for(let i=0;i<90;i++){let x=rand()*WORLD,y=GROUND+29+rand()*56;rect(x,y,15,6,'#6f534a');rect(x+3,y,9,3,'#c4956b');}}
function hay(p){let {x,y,w,h}=p;shadow(x+w/2,y+h,w+24);rect(x,y,w,h,PAL.ink);rect(x+3,y+3,w-6,h-6,'#c18b46');rect(x+3,y+3,w-6,12,'#edd08a');rect(x+3,y+15,w-6,h-21,'#d9ad5f');rect(x+w-12,y+15,9,h-18,'#a5723f');const rand=rng(x);for(let yy=18;yy<h-4;yy+=6)for(let xx=6;xx<w-12;xx+=12){rect(x+xx,y+yy,6+Math.floor(rand()*3)*3,3,rand()>.5?'#e8c87b':'#b78c49');}for(let xx of [Math.floor(w*.24),Math.floor(w*.74)]){rect(x+xx,y+3,6,h-6,'#77583e');rect(x+xx,y+3,3,h-6,'#ab8250');}rect(x+3,y+3,w-6,3,'#f7e2a2');if(h>85){rect(x+3,y+Math.round(h/2),w-6,3,'#9b703d');}}
function makeLayer(width,fn){const old=ctx,layer=document.createElement('canvas');layer.width=width;layer.height=H;ctx=layer.getContext('2d');ctx.imageSmoothingEnabled=false;fn();ctx=old;return layer;}
let scenery,skyLayer,hillsLayer;
function initScenery(){skyLayer=makeLayer(1800,()=>{for(let y=0;y<H;y+=6){let t=y/H;rect(0,y,1800,6,`rgb(${Math.round(111+112*t)},${Math.round(168+46*t)},${Math.round(193-41*t)})`);}disk(1470,102,43,'#f3d894');disk(1470,102,32,'#ffe8af');for(let i=0;i<9;i++){let x=i*211+10,y=58+(i%3)*36;for(let j=0;j<5;j++)disk(x+j*23,y+Math.sin(j*1.8)*10,16+j%2*10,'#d2d6cb');for(let j=0;j<5;j++)disk(x+j*23,y-8+Math.sin(j*1.8)*10,15+j%2*8,'#f6ead3');rect(x-9,y,125,9,'#f6ead3');}});
 hillsLayer=makeLayer(1800,()=>{for(let i=0;i<7;i++)poly([[i*300-160,355],[i*300-100,252],[i*300+30,212+(i%2)*25],[i*300+130,252],[i*300+230,355]],'#87a799');for(let i=0;i<8;i++)poly([[i*260-140,390],[i*260-45,293],[i*260+53,270],[i*260+142,306],[i*260+240,390]],'#819b75');rect(0,338,1800,110,'#99ab77');for(let y=349;y<405;y+=16)rect(0,y,1800,3,'#b8bb83');const rand=rng(28);for(let x=0;x<1800;x+=21){let h=18+rand()*27;rect(x,350-h,15,h,'#668269');rect(x+3,344-h,9,9,'#789575');} });
 scenery=makeLayer(WORLD,()=>{rect(0,361,WORLD,85,'#8a9f62');const rand=rng(811);for(let i=0;i<1500;i++){let x=Math.floor(rand()*WORLD/3)*3,y=363+Math.floor(rand()*83/3)*3;rect(x,y,3+Math.floor(rand()*3)*3,3,['#738855','#9cad6a','#adba7c','#627a50'][i%4]);}barn(1050,441);barn(2750,441);for(const [x,s] of [[155,.95],[835,.88],[1795,1.03],[2420,.84]])tree(x,443,s,x);fence();cow(557,443);cow(1732,443);tractor(2465,443);for(let x of [290,905,1490,2135,2820])chicken(x,444);for(let i=0;i<85;i++)flower(30+rand()*(WORLD-60),418+rand()*26,i%3);terrain();for(const p of platforms)if(p.type!=='ground')hay(p);rect(2635,250,9,196,'#55464b');rect(2638,253,3,190,'#b78e65');rect(2641,248,125,43,'#51404a');rect(2644,251,119,37,'#f2d6a0');rect(2647,254,113,3,'#fff0c3');text('CÉLIA',2654,277,21,'#674a61');});}
function draw(){
 ctx.imageSmoothingEnabled=false;if(!scenery)initScenery();
 ctx.drawImage(skyLayer,-Math.floor(cam*.13),0);const shift=Math.floor(cam*.32);ctx.drawImage(hillsLayer,-shift,0);ctx.drawImage(hillsLayer,1800-shift,0);
 ctx.save();ctx.translate(-Math.round(cam),0);ctx.drawImage(scenery,0,0);
 for(const s of stars)if(!s.taken){let yy=s.y+Math.sin(time*4+s.x)*3;star(s.x,yy);rect(s.x-5,yy-7,4,4,'#fff3bf');}
 shadow(2720,GROUND,45);sprite(won?'celia-win':'celia-idle',2720,GROUND,57);
 shadow(player.x+player.w/2,GROUND,Math.max(18,40-(GROUND-player.y-player.h)*.1));
 const pose=won?'elise-win':!player.grounded?'elise-jump':Math.abs(player.vx)>0?'elise-walk'+Math.floor(time*10)%4:'elise-idle';sprite(pose,player.x+player.w/2,player.y+player.h,player.h,player.face);
 if(player.x>2520&&!won&&!stars.every(s=>s.taken)){rect(2470,186,375,40,'#fff0c2');text('Il manque encore des étoiles !',2482,212,17,'#674a61');}
 // Quelques brins à l'avant du sol donnent de la profondeur sans masquer les obstacles.
 for(let x=12;x<WORLD;x+=57){rect(x,GROUND-1,3,5,'#b0bd71');rect(x+6,GROUND+2,3,4,'#718949');}
 ctx.restore();
 if(!started||won||paused){rect(135,133,690,240,'#30334dee');text(won?'BRAVO ÉLISE & CÉLIA !':paused?'PAUSE':'LA GRANDE AVENTURE',190,190,32,'#ffe7a1');text(won?'Les cinq étoiles de la ferme sont réunies.':'La ferme · Niveau test',190,234,20);text(won?'Clique sur Recommencer pour rejouer.':paused?'Appuie sur P pour reprendre.':'Marche, saute et retrouve Célia !',190,280,19);if(!started)text('Clique sur Jouer sous le jeu.',190,326,18,'#ffc4ca');}
}
function loop(now){let dt=Math.min((now-last)/1000||0,.05);last=now;if(ready&&started&&!won&&!paused){while(dt>0){let step=Math.min(dt,1/120);advance(step);dt-=step;}}draw();requestAnimationFrame(loop);}
const mapping={ArrowLeft:'left',KeyA:'left',KeyQ:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump'};
addEventListener('keydown',e=>{if(mapping[e.code]){e.preventDefault();keys.add(mapping[e.code]);if(mapping[e.code]==='jump'&&!e.repeat)jumpQueued=true;}if(e.code==='KeyP'&&!e.repeat&&started&&!won){paused=!paused;keys.clear();updateHud();}});
addEventListener('keyup',e=>{keys.delete(mapping[e.code]);});addEventListener('blur',()=>{keys.clear();jumpQueued=false;if(started&&!won){paused=true;updateHud();}});
for(const b of document.querySelectorAll('[data-control]')){b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.control);if(b.dataset.control==='jump')jumpQueued=true;});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(b.dataset.control));}
document.querySelector('#play').onclick=()=>{if(!ready)return;if(won||!started)reset();started=true;paused=false;updateHud();document.querySelector('#play').textContent='Reprendre';farmAudio.start();};document.querySelector('#restart').onclick=()=>{reset();started=true;updateHud();farmAudio.start();};
document.querySelector('#sound').onclick=farmAudio.toggle;
reset();Promise.all(Object.entries(SPRITE_DATA).map(([name,src])=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{sprites[name]=im;resolve();};im.onerror=reject;im.src=src;}))).then(()=>{ready=true;document.querySelector('#play').disabled=false;document.querySelector('#play').textContent='Jouer';}).catch(()=>{document.querySelector('#status').textContent='Impossible de charger les personnages.';});requestAnimationFrame(loop);
// Disponible pour la vérification du niveau et l’extension du prototype.
window.farmGame={player,platforms,get stars(){return stars;},get won(){return won;},advance,reset};
</script></html>
